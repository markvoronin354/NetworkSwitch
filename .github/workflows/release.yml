name: Release APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        default: 'v1.0.0'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Extract version
      id: get_version
      env:
        INPUT_VERSION: ${{ github.event.inputs.version }}
      run: |
        if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
          VERSION="$INPUT_VERSION"
        else
          VERSION="${GITHUB_REF#refs/tags/}"
        fi
        if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "::error::Version must look like v1.2.3, got: $VERSION"
          exit 1
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "version_name=${VERSION#v}" >> "$GITHUB_OUTPUT"

    - name: Run tests
      run: ./gradlew test -PversionNameOverride=${{ steps.get_version.outputs.version_name }}

    - name: Decode signing keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "::error::SIGNING_KEY_STORE_BASE64 is not set; refusing to publish a debug-signed release APK."
          exit 1
        fi
        printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
        echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

    - name: Build signed release APK
      env:
        SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      run: ./gradlew assembleRelease -PversionNameOverride=${{ steps.get_version.outputs.version_name }}

    - name: Rename APK
      run: |
        RELEASE_DIR="app/build/outputs/apk/release"
        mv "$RELEASE_DIR/app-release.apk" "$RELEASE_DIR/NetworkSwitch-${{ steps.get_version.outputs.version }}.apk"

    - name: Generate changelog
      id: changelog
      run: |
        CURRENT_TAG="${{ steps.get_version.outputs.version }}"
        REPO_URL="https://github.com/${{ github.repository }}"
        
        git fetch --unshallow --tags --force 2>/dev/null || git fetch --tags --force
        
        PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${CURRENT_TAG}$" | head -n 1)

        if [ -z "$PREVIOUS_TAG" ]; then
          CHANGELOG_BODY=""
          while IFS= read -r commit; do
            HASH=$(echo "$commit" | cut -d' ' -f1)
            MESSAGE=$(echo "$commit" | cut -d' ' -f2-)
            SHORT_HASH=$(echo "$HASH" | cut -c1-7)
            CHANGELOG_BODY="${CHANGELOG_BODY}- [\`${SHORT_HASH}\`](${REPO_URL}/commit/${HASH}) ${MESSAGE}"$'\n'
          done <<< "$(git log --pretty=format:"%H %s" "$CURRENT_TAG" --reverse)"
        else
          CHANGELOG_BODY=""
          while IFS= read -r commit; do
            if [ -n "$commit" ]; then
              HASH=$(echo "$commit" | cut -d' ' -f1)
              MESSAGE=$(echo "$commit" | cut -d' ' -f2-)
              SHORT_HASH=$(echo "$HASH" | cut -c1-7)
              CHANGELOG_BODY="${CHANGELOG_BODY}- [\`${SHORT_HASH}\`](${REPO_URL}/commit/${HASH}) ${MESSAGE}"$'\n'
            fi
          done <<< "$(git log --pretty=format:"%H %s" "${PREVIOUS_TAG}..${CURRENT_TAG}" --reverse)"
          
          if [ -z "$CHANGELOG_BODY" ]; then
            while IFS= read -r hash; do
              if [ -n "$hash" ]; then
                MESSAGE=$(git log -1 --pretty=format:"%s" "$hash")
                SHORT_HASH=$(echo "$hash" | cut -c1-7)
                CHANGELOG_BODY="${CHANGELOG_BODY}- [\`${SHORT_HASH}\`](${REPO_URL}/commit/${hash}) ${MESSAGE}"$'\n'
              fi
            done <<< "$(git rev-list "${PREVIOUS_TAG}..${CURRENT_TAG}" --reverse)"
          fi
        fi

        CHANGELOG_BODY=$(echo "$CHANGELOG_BODY" | sed -z '$ s/\n$//')

        if [ -z "$CHANGELOG_BODY" ]; then
          CHANGELOG_BODY="- No changes in this release."
        fi

        {
          echo "changelog<<EOF"
          echo "$CHANGELOG_BODY"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        name: NetworkSwitch ${{ steps.get_version.outputs.version }}
        body: |
          ## Changes in this release
          
          ${{ steps.changelog.outputs.changelog }}
          
          ## Installation
          Download the APK file below and install it on your Android device.
        files: |
          app/build/outputs/apk/release/NetworkSwitch-*.apk
        draft: false
        prerelease: false
        token: ${{ secrets.GITHUB_TOKEN }}
